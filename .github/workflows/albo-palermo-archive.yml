# Every night: dump the acts in publication on the Albo Pretorio of Palermo,
# merge them into one JSON Lines archive (append, sort, drop identical lines)
# and replace the asset of the release `albo-palermo-data`. Acts accumulate;
# past versions of the file are not kept: no commits, no history.
#
# Any failure stops the job before the upload, so the published archive stays
# as it was: a failed or empty dump, a row with different fields, an archive
# that would shrink. See bin/albo-palermo-merge.sh.
name: albo-palermo nightly

on:
  schedule:
    # Off the full hour and apart from the delibere daily: GitHub delays or
    # drops scheduled runs in busy slots.
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: albo-palermo-nightly
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: albo-palermo-data
      ASSET: albo-palermo.jsonl
      INDEX: albo-palermo.sqlite
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install opencli and the adapter
        run: |
          npm install -g @jackwener/opencli@1.8.8
          opencli plugin install "file://$PWD/plugins/albo-palermo"
          opencli validate albo-palermo

      - name: Download the current archive
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release download "$TAG" --pattern "$ASSET" --output previous.jsonl
            echo "PREV=previous.jsonl" >> "$GITHUB_ENV"
            gh release download "$TAG" --pattern "$INDEX" --output "$INDEX" || echo "no index yet: first build"
          else
            echo "no release $TAG yet: first run"
            echo "PREV=" >> "$GITHUB_ENV"
          fi

      - name: Dump
        run: opencli albo-palermo dump > today.jsonl

      - name: Merge and check
        run: bin/albo-palermo-merge.sh "$PREV" today.jsonl "$ASSET"

      # The semantic index: one vector per act, only the new or changed rows are
      # embedded. A missing key or a failed call stops the job before the upload.
      - name: Update the semantic index
        run: bin/albo-palermo-index.py "$ASSET" "$INDEX"

      - name: Publish
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --latest=false --title "Albo Pretorio di Palermo - archive" \
              --notes "Acts published on the Albo Pretorio of the Comune di Palermo, one JSON object per line. Every night \`opencli albo-palermo dump\` (the 20 newest acts per document type, 40 for the executive determinations and ordinances) is appended to the archive, which is then sorted and cleared of identical lines, so acts accumulate over time. The file is replaced each night: past versions of the file are not kept."
          fi
          gh release upload "$TAG" "$ASSET" "$INDEX" --clobber
